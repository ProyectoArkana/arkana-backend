# Solo PostgreSQL: la cola de matchmaking y los equipos de batalla viven en memoria.
# Si cambias init-db.sql, recrea el volumen:  docker compose down -v && docker compose up -d
services:
  postgres:
    image: postgres:15-alpine
    container_name: arkana_db
    environment:
      POSTGRES_USER: arkana_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: arkana_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped

volumes:
  pgdata:
